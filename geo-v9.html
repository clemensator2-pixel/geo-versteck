<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geo-Versteck (echte Karte)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
:root{ --accent:#2563eb; --danger:#dc2626; --safe:#16a34a; --bg:#f5f6f8; --card:#fff; --text:#1b1e24; --muted:#6b7280; --border:#e2e4e9; }
*{box-sizing:border-box;}
html,body{height:100%; margin:0; font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text);}
#start{padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px));}
h1{font-size:1.15rem; margin:0 0 4px;}
p.sub{color:var(--muted); font-size:.85rem; margin:0 0 14px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px;}
label{display:block; font-size:.8rem; color:var(--muted); margin:10px 0 4px;}
input[type=text]{width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--border); font-size:1rem;}
.row{display:flex; gap:8px;}
.row>*{flex:1;}
button{border:none; border-radius:10px; padding:11px 14px; font-size:.95rem; font-weight:600; cursor:pointer;}
button.primary{background:var(--accent); color:#fff; width:100%;}
button.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent);}
button:disabled{opacity:.45;}
small.note{color:var(--muted); font-size:.72rem; display:block; margin-top:8px;}
#map{position:fixed; inset:0; display:none;}
#hud{position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0; padding:10px; z-index:1000; display:none; pointer-events:none;}
#hud .card{pointer-events:auto; padding:10px 12px; font-size:.82rem;}
.banner{padding:8px 10px; border-radius:9px; font-weight:600; font-size:.82rem; margin-bottom:6px;}
.banner.danger{background:#fee2e2; color:#991b1b;}
.banner.safe{background:#dcfce7; color:#166534;}
#bottomPanel{position:fixed; left:0; right:0; bottom:env(safe-area-inset-bottom,0px); z-index:1000; display:none; padding:10px;}
#bottomPanel .card{pointer-events:auto; max-height:38vh; overflow-y:auto;}
.zone-row{display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); font-size:.85rem;}
.zone-row:last-child{border-bottom:none;}
#drawBar{position:fixed; left:0; right:0; bottom:env(safe-area-inset-bottom,0px); z-index:1001; display:none; padding:10px;}
#drawBar .card{pointer-events:auto;}
.hidden{display:none !important;}
</style>
</head>
<body>

<div id="start">
  <h1>🕵️ Geo-Versteck</h1>
  <p class="sub">Echte OpenStreetMap-Karte, GPS und gemeinsamer Spielstand (Version 9)</p>

  <div class="card" id="menuCard">
    <button class="primary" onclick="showCreate()">Neues Spiel erstellen</button>
    <button class="ghost" style="width:100%;margin-top:10px" onclick="showJoin()">Spiel beitreten</button>
    <button class="ghost" style="width:100%;margin-top:10px" onclick="testConnection()">Verbindung testen</button>
  </div>

  <div class="card hidden" id="createCard">
    <h3 style="margin-top:0">Neues Spiel erstellen</h3>
    <label>Dein Name</label>
    <input type="text" id="createName" placeholder="Dein Name">
    <label>Deine Rolle</label>
    <button class="ghost" id="createRoleSucher" onclick="setCreateRole('sucher')">Sucher</button>
    <button class="ghost" style="margin-left:6px" id="createRoleVersteck" onclick="setCreateRole('versteck')">Versteckt</button>

    <label>Spielcode (optional selbst vergeben)</label>
    <input type="text" id="createCode" placeholder="leer = automatisch">

    <label>Wie lange soll eine gesperrte Zone gesperrt sein?</label>
    <select id="lockDuration" style="width:100%;padding:10px;border-radius:9px;border:1px solid var(--border);font-size:1rem">
      <option value="2">2 Minuten</option>
      <option value="5" selected>5 Minuten</option>
      <option value="10">10 Minuten</option>
      <option value="15">15 Minuten</option>
      <option value="20">20 Minuten</option>
    </select>

    <label>Wie oft sollen die Standorte der Versteckten sichtbar werden?</label>
    <select id="revealDuration" style="width:100%;padding:10px;border-radius:9px;border:1px solid var(--border);font-size:1rem">
      <option value="2">Alle 2 Minuten</option>
      <option value="5">Alle 5 Minuten</option>
      <option value="10" selected>Alle 10 Minuten</option>
      <option value="15">Alle 15 Minuten</option>
      <option value="20">Alle 20 Minuten</option>
    </select>

    <button class="primary" style="margin-top:12px" onclick="createGame()">Spiel erstellen</button>
    <button class="ghost" style="width:100%;margin-top:8px" onclick="backToMenu()">Zurück</button>
  </div>

  <div class="card hidden" id="joinCard">
    <h3 style="margin-top:0">Spiel beitreten</h3>
    <label>Dein Name</label>
    <input type="text" id="joinName" placeholder="Dein Name">
    <label>Rolle</label>
    <button class="ghost" id="joinRoleSucher" onclick="setJoinRole('sucher')">Sucher</button>
    <button class="ghost" style="margin-left:6px" id="joinRoleVersteck" onclick="setJoinRole('versteck')">Versteckt</button>
    <label>Spielcode</label>
    <input type="text" id="joinCode" placeholder="Code vom Ersteller">
    <button class="primary" style="margin-top:12px" onclick="joinGame()">Beitreten</button>
    <button class="ghost" style="width:100%;margin-top:8px" onclick="backToMenu()">Zurück</button>
  </div>

  <small class="note">Nutzt ntfy.sh als kostenlosen Nachrichtendienst für den gemeinsamen Spielstand. Karte: © OpenStreetMap-Mitwirkende.</small>
</div>

<div id="map"></div>
<div id="hud">
  <div class="card">
    <div id="banners"></div>
    <div id="gpsLine" style="color:var(--muted)">GPS: —</div>
    <div id="peerLine" style="color:var(--muted); margin-top:2px;"></div>
    <div id="revealLine" style="color:var(--muted); margin-top:2px;"></div>
<div id="gameCodeLine" style="color:var(--muted); margin-top:2px;"></div>
  </div>
</div>
<div id="drawBar">
  <div class="card">
    <p id="drawHint" style="margin:0 0 8px;font-size:.85rem;"></p>
    <div class="row">
      <button class="ghost" onclick="undoPoint()">Zurück</button>
      <button class="primary" onclick="finishShape()">Fertig</button>
    </div>
    <button class="primary hidden" id="btnStartGame" style="margin-top:8px" onclick="pushInitialState()">Spiel starten</button>
  </div>
</div>
<div id="bottomPanel">
  <div class="card">
    <p id="waitArea" class="hidden" style="margin:0 0 8px;color:var(--muted);font-size:.85rem;">Warte auf Spielgebiet vom Ersteller…</p>
    <div class="row" style="margin-bottom:8px;">
      <button class="ghost hidden" id="btnRedraw" onclick="startDrawBoundary()">Gebiet neu zeichnen</button>
      <button class="ghost" onclick="manualRefresh()">🔄 Aktualisieren</button>
    </div>
    <strong style="font-size:.85rem;">Zonen</strong>
    <div id="zoneList"></div>
  </div>
</div>

<script>
const KVDB_BASE='https://ntfy.sh';
const DEFAULT_LOCK_COOLDOWN=5*60*1000;
const DEFAULT_REVEAL_INTERVAL=10*60*1000;
let state={
  name:'', role:null, code:null, isCreator:false, map:null, myLayer:null, peerLayers:{},
  boundaryLayer:null, zoneLayers:{}, mode:null, points:[], previewLayer:null,
  boundary:null, zones:[], myLocks:[], lat:null, lng:null, acc:null, peers:{},
  since:'10m', seen:new Set(), revealBucket:null, revealedHiders:{},
  lockCooldown:DEFAULT_LOCK_COOLDOWN, revealInterval:DEFAULT_REVEAL_INTERVAL,
  lastErr:'', lastPush:0, lastGeometryPush:0
};

function $(id){ return document.getElementById(id); }

function showCreate(){ $('menuCard').classList.add('hidden'); $('joinCard').classList.add('hidden'); $('createCard').classList.remove('hidden'); }
function showJoin(){ $('menuCard').classList.add('hidden'); $('createCard').classList.add('hidden'); $('joinCard').classList.remove('hidden'); }
function backToMenu(){ $('createCard').classList.add('hidden'); $('joinCard').classList.add('hidden'); $('menuCard').classList.remove('hidden'); }

function setCreateRole(r){
  state.role=r;
  $('createRoleSucher').style.background=r==='sucher'?'var(--accent)':'transparent';
  $('createRoleSucher').style.color=r==='sucher'?'#fff':'var(--accent)';
  $('createRoleVersteck').style.background=r==='versteck'?'var(--accent)':'transparent';
  $('createRoleVersteck').style.color=r==='versteck'?'#fff':'var(--accent)';
}
function setJoinRole(r){
  state.role=r;
  $('joinRoleSucher').style.background=r==='sucher'?'var(--accent)':'transparent';
  $('joinRoleSucher').style.color=r==='sucher'?'#fff':'var(--accent)';
  $('joinRoleVersteck').style.background=r==='versteck'?'var(--accent)':'transparent';
  $('joinRoleVersteck').style.color=r==='versteck'?'#fff':'var(--accent)';
}
function randomCode(){ return 'gv-'+Math.random().toString(36).slice(2,10); }

async function ntfyPublish(obj){
  try{
    const res=await fetch(`${KVDB_BASE}/${state.code}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(obj)
    });
    if(res.ok) return true;
    state.lastErr='Status '+res.status;
    return false;
  }catch(e){ state.lastErr=e.message; return false; }
}

async function ntfyPoll(){
  try{
    const res=await fetch(`${KVDB_BASE}/${state.code}/json?poll=1&since=${state.since}`);
    if(!res.ok){ state.lastErr='Status '+res.status; return []; }
    const text=await res.text(), out=[];
    text.split('\n').forEach(line=>{
      if(!line.trim()) return;
      try{
        const env=JSON.parse(line);
        if(env.event==='message' && env.message && !state.seen.has(env.id)){
          state.seen.add(env.id);
          state.since=env.time;
          try{ out.push(JSON.parse(env.message)); }catch(e){}
        }
      }catch(e){}
    });
    return out;
  }catch(e){ state.lastErr=e.message; return []; }
}

function geometryMessage(){
  return {
    type:'geometry',
    boundary:state.boundary,
    zones:state.zones||[],
    settings:{
      lockCooldown:state.lockCooldown,
      revealInterval:state.revealInterval
    }
  };
}

function applyMsg(m){
  if(m.type==='geometry'){
    // Vollständigen Spielstand übernehmen – dadurch werden auch neue/gelöschte Zonen synchronisiert.
    state.boundary=m.boundary||null;
    state.zones=m.zones||[];
    if(m.settings){
      state.lockCooldown=Number(m.settings.lockCooldown)||DEFAULT_LOCK_COOLDOWN;
      state.revealInterval=Number(m.settings.revealInterval)||DEFAULT_REVEAL_INTERVAL;
    }
    if(state.map){
      redrawZones();
      const w=$('waitArea'); if(w) w.classList.add('hidden');
    }
  }else if(m.type==='player' && m.name!==state.name){
    state.peers[m.name]={
      role:m.role, lat:m.lat, lng:m.lng, acc:m.acc,
      myLocks:m.myLocks||[], lastSeen:Date.now()
    };
  }
}

async function testConnection(){
  const code=$('joinCode')?.value.trim() || randomCode();
  try{
    const r=await fetch(`${KVDB_BASE}/${code}`,{method:'POST',body:'testnachricht'});
    alert('Verbindung zu ntfy.sh: Status '+r.status+'\nThema: '+code);
  }catch(e){ alert('Verbindung FEHLER: '+e.message); }
}

async function createGame(){
  const name=$('createName').value.trim()||'Spieler';
  if(!state.role){ alert('Bitte Rolle auswählen.'); return; }
  state.name=name;
  state.code=$('createCode').value.trim()||randomCode();
  state.isCreator=true;
  state.lockCooldown=(Number($('lockDuration').value)||5)*60*1000;
  state.revealInterval=(Number($('revealDuration').value)||10)*60*1000;
  state.since='10m';

  const ok=await ntfyPublish({
    type:'geometry',
    boundary:null,
    zones:[],
    settings:{lockCooldown:state.lockCooldown,revealInterval:state.revealInterval}
  });
  if(!ok){ alert('Verbindung zu ntfy.sh fehlgeschlagen.\nDetail: '+(state.lastErr||'unbekannt')); return; }

  enterMap();
  alert('Spielcode:\n'+state.code+'\n\nDiesen Code kannst du an deine Mitspieler weitergeben.');
}

async function joinGame(){
  const name=$('joinName').value.trim()||'Spieler';
  if(!state.role){ alert('Bitte Rolle auswählen.'); return; }
  const c=$('joinCode').value.trim();
  if(!c){ alert('Bitte Spielcode eingeben.'); return; }
  state.name=name; state.code=c; state.isCreator=false; state.since='24h';
  const msgs=await ntfyPoll();
  msgs.forEach(applyMsg);
  enterMap();
}

function enterMap(){
  $('start').style.display='none';
  $('map').style.display='block';
  $('hud').style.display='block';
  $('bottomPanel').style.display='block';
  $('btnRedraw').classList.toggle('hidden',!state.isCreator);
  $('gameCodeLine').textContent='Spielcode: '+state.code;
  state.map=L.map('map').setView([51.8309,7.2783],16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap-Mitwirkende',maxZoom:19
  }).addTo(state.map);
  startGeolocation();
  redrawZones();
  if(!state.boundary){
    if(state.isCreator) startDrawBoundary();
    else $('waitArea').classList.remove('hidden');
  }
  pollLoop();
  setInterval(tick,2000);
  // Creator sendet regelmäßig den kompletten Spielstand, damit Zonen zuverlässig nachziehen.
  if(state.isCreator) setInterval(()=>publishGeometry(true),5000);
}

// ---- Zeichnen ----
function startDrawBoundary(){
  state.mode='boundary'; state.points=[]; state.zones=state.zones||[]; state.boundary=null;
  $('drawBar').style.display='block';
  $('btnStartGame').classList.add('hidden');
  updateDrawHint();
  state.map.off('click'); state.map.on('click',onMapClickDraw);
}
function startZoneDraw(){
  state.mode='zone'; state.points=[];
  $('drawBar').style.display='block';
  $('btnStartGame').classList.add('hidden');
  updateDrawHint();
  state.map.off('click'); state.map.on('click',onMapClickDraw);
}
function updateDrawHint(){
  $('drawHint').textContent=state.mode==='boundary'
    ? 'Tippe Eckpunkte entlang der Außengrenze des Spielgebiets an, dann „Fertig“.'
    : 'Tippe Eckpunkte für eine Unterzone an, dann „Fertig“.';
}
function onMapClickDraw(e){ state.points.push(e.latlng); drawPreview(); }
function undoPoint(){ state.points.pop(); drawPreview(); }
function drawPreview(){
  if(state.previewLayer) state.map.removeLayer(state.previewLayer);
  if(state.points.length)
    state.previewLayer=L.polygon(state.points,{color:state.mode==='zone'?'#dc2626':'#2563eb'}).addTo(state.map);
}
async function finishShape(){
  if(state.points.length<3){ alert('Mindestens 3 Punkte nötig.'); return; }
  if(state.mode==='boundary'){
    state.boundary=state.points.map(p=>[p.lat,p.lng]);
    state.points=[]; state.mode='zone';
    $('btnStartGame').classList.remove('hidden');
    updateDrawHint();
  }else{
    const name=prompt('Name der Zone:','Zone '+(state.zones.length+1))||('Zone '+(state.zones.length+1));
    state.zones.push({id:'z'+Date.now(),name,points:state.points.map(p=>[p.lat,p.lng])});
    state.points=[];
    $('btnStartGame').classList.remove('hidden');
    await publishGeometry(true);
  }
  if(state.previewLayer){ state.map.removeLayer(state.previewLayer); state.previewLayer=null; }
  redrawZones();
}
async function publishGeometry(showError=false){
  if(!state.isCreator || !state.code || !state.boundary) return false;
  const ok=await ntfyPublish(geometryMessage());
  if(!ok && showError) alert('Zonen konnten nicht synchronisiert werden.\n'+(state.lastErr||'Unbekannter Fehler'));
  if(ok) state.lastGeometryPush=Date.now();
  return ok;
}
async function pushInitialState(){
  if(!state.boundary){ alert('Bitte zuerst das Spielgebiet zeichnen.'); return; }
  await publishGeometry(true);
  $('drawBar').style.display='none';
  state.map.off('click'); state.mode=null;
  redrawZones();
}
function redrawZones(){
  if(state.boundaryLayer) state.map.removeLayer(state.boundaryLayer);
  if(state.boundary)
    state.boundaryLayer=L.polygon(state.boundary,{color:'#2563eb',fillOpacity:.05})
      .bindTooltip('Spielgebiet',{sticky:true}).addTo(state.map);

  Object.values(state.zoneLayers).forEach(l=>state.map.removeLayer(l));
  state.zoneLayers={};
  (state.zones||[]).forEach(z=>{
    const locked=combinedLocks().has(z.id);
    state.zoneLayers[z.id]=L.polygon(z.points,{
      color:locked?'#dc2626':'#16a34a',fillOpacity:locked?.28:.15
    }).bindTooltip(zoneLabel(z),{sticky:true}).addTo(state.map);
  });
  renderZoneList();
}
function zoneLabel(z){ return z.name+(combinedLocks().has(z.id)?' 🔒 GESPERRT':' 🟢 OFFEN'); }

// ---- GPS ----
function startGeolocation(){
  if(!navigator.geolocation){ $('gpsLine').textContent='GPS: von diesem Browser nicht unterstützt.'; return; }
  navigator.geolocation.watchPosition(pos=>{
    state.lat=pos.coords.latitude; state.lng=pos.coords.longitude; state.acc=pos.coords.accuracy;
    $('gpsLine').textContent=`GPS: ${state.lat.toFixed(5)}, ${state.lng.toFixed(5)} (±${Math.round(state.acc)}m)`;
    if(!state.myLayer){
      state.myLayer=L.circleMarker([state.lat,state.lng],{
        radius:8,color:'#fff',weight:2,
        fillColor:state.role==='sucher'?'#dc2626':'#2563eb',fillOpacity:1
      }).bindTooltip(state.name).addTo(state.map);
      state.map.setView([state.lat,state.lng],17);
    }else state.myLayer.setLatLng([state.lat,state.lng]);
    checkStatus(); pushMyState();
  },err=>{$('gpsLine').textContent='GPS: ❌ '+err.message;},{
    enableHighAccuracy:true,maximumAge:4000
  });
}
function pointInPoly(lat,lng,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1];
    const intersect=((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}
function combinedLocks(){
  const set=new Set();
  const all=Object.assign({},state.peers,{__self:{role:state.role,myLocks:state.myLocks}});
  Object.values(all).forEach(p=>{
    if(p.role==='sucher'&&p.myLocks) p.myLocks.forEach(l=>{
      if(Date.now()-l.lockedAt < state.lockCooldown) set.add(l.zoneId);
    });
  });
  return set;
}
function lastAnyLockAt(){
  let max=0;
  const all=Object.assign({},state.peers,{__self:{role:state.role,myLocks:state.myLocks}});
  Object.values(all).forEach(p=>{
    if(p.role==='sucher'&&p.myLocks) p.myLocks.forEach(l=>{
      if(Date.now()-l.lockedAt < state.lockCooldown && l.lockedAt>max) max=l.lockedAt;
    });
  });
  return max;
}
async function lockZone(id){
  if(combinedLocks().has(id)){ alert('Diese Zone ist bereits gesperrt.'); tick(); return; }
  const last=lastAnyLockAt();
  const remaining=state.lockCooldown-(Date.now()-last);
  if(remaining>0){ alert('Noch '+Math.ceil(remaining/60000)+' Min. bis zur nächsten Sperre (Team-Timer).'); return; }
  state.myLocks.push({zoneId:id,lockedAt:Date.now()});
  await pushMyState(true); tick();
}
function updateZoneVisuals(){
  const locks=combinedLocks();
  (state.zones||[]).forEach(z=>{
    const l=state.zoneLayers[z.id];
    if(l){
      l.setStyle({color:locks.has(z.id)?'#dc2626':'#16a34a',fillOpacity:locks.has(z.id)?.28:.15});
      l.unbindTooltip().bindTooltip(zoneLabel(z),{sticky:true});
    }
  });
}
function checkStatus(){
  if(state.lat==null||!state.boundary) return;
  const locks=combinedLocks(),banners=$('banners'); banners.innerHTML='';
  const inBoundary=pointInPoly(state.lat,state.lng,state.boundary);
  if(!inBoundary) banners.innerHTML='<div class="banner danger">⚠️ Du bist außerhalb des Spielgebiets!</div>';
  else{
    const inLocked=(state.zones||[]).some(z=>locks.has(z.id)&&pointInPoly(state.lat,state.lng,z.points));
    banners.innerHTML=inLocked
      ? '<div class="banner danger">🔒 Du bist in einer gesperrten Zone!</div>'
      : '<div class="banner safe">✅ Du bist im erlaubten Bereich.</div>';
  }
}
function renderZoneList(){
  const locks=combinedLocks(),zl=$('zoneList'); zl.innerHTML='';
  (state.zones||[]).forEach(z=>{
    const locked=locks.has(z.id),row=document.createElement('div');
    row.className='zone-row';
    const last=lastAnyLockAt(),remaining=Math.max(0,state.lockCooldown-(Date.now()-last));
    let btn='';
    if(state.role==='sucher'&&!locked){
      const dis=remaining>0;
      btn=`<button ${dis?'disabled':''} onclick="lockZone('${z.id}')">${dis?Math.ceil(remaining/60000)+' Min':'Sperren'}</button>`;
    }
    row.innerHTML=`<span>${z.name}${locked?' 🔒 GESPERRT':' 🟢 OFFEN'}</span>${btn}`;
    zl.appendChild(row);
  });
}

// ---- Sync / Spieler ----
function currentBucket(){ return Math.floor(Date.now()/state.revealInterval); }
function maybeReveal(){
  if(state.role!=='sucher') return;
  const b=currentBucket();
  if(state.revealBucket===b) return;
  state.revealBucket=b; state.revealedHiders={};
  Object.entries(state.peers).forEach(([n,p])=>{
    if(p.role==='versteck'&&p.lat!=null) state.revealedHiders[n]={lat:p.lat,lng:p.lng};
  });
}
function renderPeers(){
  // Spieler, die länger als 25 Sekunden nichts senden, werden als offline behandelt.
  const now=Date.now();
  Object.entries(state.peers).forEach(([name,p])=>{
    if(now-p.lastSeen>25000){
      if(state.peerLayers[name]){state.map.removeLayer(state.peerLayers[name]);delete state.peerLayers[name];}
      return;
    }
    let pos=p;
    if(state.role==='sucher'&&p.role==='versteck'){
      pos=state.revealedHiders[name];
      if(!pos){
        if(state.peerLayers[name]){state.map.removeLayer(state.peerLayers[name]);delete state.peerLayers[name];}
        return;
      }
    }
    if(pos.lat==null) return;
    if(!state.peerLayers[name]){
      state.peerLayers[name]=L.circleMarker([pos.lat,pos.lng],{
        radius:6,color:'#fff',weight:2,
        fillColor:p.role==='sucher'?'#dc2626':'#2563eb',fillOpacity:1
      }).bindTooltip(name).addTo(state.map);
    }else state.peerLayers[name].setLatLng([pos.lat,pos.lng]);
  });
}
function updateRevealLine(){
  const el=$('revealLine'); if(!el)return;
  if(state.role!=='sucher'){el.textContent='';return;}
  const remaining=Math.max(0,(currentBucket()+1)*state.revealInterval-Date.now());
  const m=Math.floor(remaining/60000),s=Math.floor((remaining%60000)/1000);
  el.textContent='Nächste Standort-Offenbarung in '+m+':'+String(s).padStart(2,'0');
}
function updatePeerLine(){
  const now=Date.now();
  const active=Object.entries(state.peers).filter(([n,p])=>now-p.lastSeen<=25000);
  $('peerLine').textContent='Mitspieler: '+(active.length
    ? active.map(([n,p])=>`${n} (${p.role==='sucher'?'Sucher':'Versteckt'})`).join(', ')
    : 'nur du bisher');
}
function tick(){
  maybeReveal(); renderPeers(); updateZoneVisuals(); checkStatus(); renderZoneList(); updateRevealLine(); updatePeerLine();
}
async function manualRefresh(){
  const msgs=await ntfyPoll(); msgs.forEach(applyMsg); tick();
}
async function pushMyState(force=false){
  if(!state.code||state.lat==null)return;
  if(!force&&Date.now()-(state.lastPush||0)<8000)return;
  state.lastPush=Date.now();
  await ntfyPublish({
    type:'player',name:state.name,role:state.role,lat:state.lat,lng:state.lng,
    acc:state.acc,myLocks:state.myLocks
  });
}
async function pollLoop(){
  const msgs=await ntfyPoll();
  if(msgs.length){msgs.forEach(applyMsg);tick();}
  setTimeout(pollLoop,3000);
}

</script>
