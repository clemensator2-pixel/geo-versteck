<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Versteckspiel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#e8f2ff; --bg2:#ffffff; --card:#ffffff; --ink:#1f2a44; --muted:#7b89a6; --line:#e3ebf7;
  --accent:#5b8def; --accent-soft:#eaf1ff;
  --sucher:#ff9346; --versteck:#2bb8a6; --locked:#e5484d; --open:#2fae66;
}
*{box-sizing:border-box;}
html,body{height:100%; margin:0; font-family:'Nunito',-apple-system,system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg1) 100%);}
h1,.display{font-family:'Baloo 2',cursive;}
#start{padding:24px; padding-top:calc(60px + env(safe-area-inset-top,0px)); max-width:480px; margin:0 auto;}
.title-wrap{text-align:center; margin-bottom:34px; position:relative;}
h1{font-size:2.1rem; font-weight:800; margin:0; color:var(--ink); letter-spacing:-.01em;}
.spark{position:absolute; width:16px; height:3px; background:var(--accent); border-radius:3px; opacity:.55;}
.s1{top:6px; left:8%; transform:rotate(-30deg);} .s2{top:-8px; left:18%; transform:rotate(-55deg);}
.s3{top:6px; right:8%; transform:rotate(30deg);} .s4{top:-8px; right:18%; transform:rotate(55deg);}
.choice-btn{display:flex; align-items:center; gap:14px; width:100%; background:var(--card); border:1px solid var(--line);
  border-radius:999px; padding:16px 22px; font-family:'Nunito',sans-serif; font-weight:800; font-size:1.02rem; color:var(--ink);
  box-shadow:0 8px 20px rgba(91,141,239,.08); margin-bottom:14px; cursor:pointer;}
.choice-btn.primary{background:var(--accent); color:#fff; box-shadow:0 10px 24px rgba(91,141,239,.35);}
.choice-btn .ico{width:26px; height:26px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.choice-btn .label{flex:1; text-align:left;}
.choice-btn .chev{opacity:.5; font-weight:700;}
.panel{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:20px; margin-bottom:12px; box-shadow:0 6px 20px rgba(31,42,68,.06);}
label{display:block; font-size:.76rem; color:var(--muted); margin:12px 0 5px; font-weight:700;}
input[type=text],select,input[type=range]{width:100%; padding:12px 13px; border-radius:14px; border:1.5px solid var(--line);
  font-size:1rem; background:#fbfcfe; color:var(--ink); font-family:'Nunito',sans-serif;}
input[type=text]:focus,select:focus{outline:none; border-color:var(--accent);}
.row{display:flex; gap:8px;}
.row>*{flex:1;}
button.pill{border-radius:999px; padding:13px 16px; font-size:.88rem; font-weight:800; cursor:pointer; font-family:'Nunito',sans-serif;
  border:1.5px solid var(--line); background:#fff; color:var(--ink);}
button.pill.on-sucher{background:var(--sucher); color:#fff; border-color:var(--sucher);}
button.pill.on-versteck{background:var(--versteck); color:#fff; border-color:var(--versteck);}
button.primary{background:var(--accent); color:#fff; width:100%; border:none; border-radius:999px; padding:15px; font-weight:800; font-size:.95rem; font-family:'Nunito',sans-serif;}
button.ghost{background:#fff; color:var(--ink); border:1.5px solid var(--line); border-radius:14px; padding:11px 13px; font-weight:700; font-family:'Nunito',sans-serif; font-size:.85rem;}
button.link{background:none; border:none; color:var(--muted); font-weight:700; padding:6px 0; width:auto; font-family:'Nunito',sans-serif;}
button:disabled{opacity:.4;}

#map{position:fixed; inset:0; display:none;}
#hud{position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0; padding:8px 10px; z-index:1000; display:none; pointer-events:none;}
#hud .bar{pointer-events:auto; display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.9); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-radius:999px; padding:8px 8px 8px 16px; box-shadow:0 6px 18px rgba(31,42,68,.1);}
#codeLineShort{font-weight:800; font-size:.82rem; color:var(--ink);}
#revealLine{font-weight:800; font-size:.82rem; color:var(--accent); flex:1; text-align:center;}
#moreBtn{background:var(--accent-soft); border:none; color:var(--accent); font-size:1rem; width:32px; height:32px; border-radius:50%; padding:0;}
#morePanel{pointer-events:auto; margin-top:6px; background:rgba(255,255,255,.95); border-radius:18px; padding:12px 14px; font-size:.78rem; box-shadow:0 6px 18px rgba(31,42,68,.1);}
.banner{position:fixed; left:10px; right:10px; z-index:999; padding:10px 14px; border-radius:16px; font-weight:800; font-size:.84rem;
  text-align:center; box-shadow:0 6px 16px rgba(31,42,68,.12);}
.banner.danger{background:#fde9e9; color:#b4232a; top:calc(60px + env(safe-area-inset-top,0px));}
.banner.safe{background:#e4f8ec; color:#1d7a46; top:calc(60px + env(safe-area-inset-top,0px));}

#bottomSheet{position:fixed; left:0; right:0; bottom:0; z-index:1000; display:none;}
#sheetHandle{pointer-events:auto; background:var(--card); border-radius:22px 22px 0 0; padding:10px 18px; text-align:center;
  font-weight:800; font-size:.86rem; box-shadow:0 -4px 16px rgba(31,42,68,.1); cursor:pointer;}
#sheetHandle .bar{width:38px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 8px;}
#sheetBody{pointer-events:auto; background:var(--card); max-height:0; overflow-y:auto; transition:max-height .25s ease;
  padding:0 18px; border-top:1px solid var(--line);}
#bottomSheet.open #sheetBody{max-height:52vh; padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));}
#teamTimer{display:flex; align-items:center; justify-content:space-between; background:var(--accent-soft); border-radius:14px; padding:10px 14px; margin-bottom:10px;}
#teamTimerLabel{font-size:.74rem; color:var(--muted); font-weight:700;}
#teamTimerValue{font-size:1.1rem; font-weight:800; color:var(--accent);}
.zone-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:.86rem;}
.zone-row:last-child{border-bottom:none;}
.zone-row button{border-radius:999px; padding:7px 14px; font-size:.76rem; font-weight:800; background:var(--accent); color:#fff; border:none;}
.zone-row button:disabled{background:var(--line); color:var(--muted);}
.tag{display:inline-block; padding:2px 8px; border-radius:999px; font-size:.65rem; font-weight:800; margin-left:6px;}
.tag.locked{background:#fde9e9; color:var(--locked);}
.tag.open{background:#e4f8ec; color:var(--open);}

#drawBar,#zoneBar{position:fixed; left:0; right:0; bottom:0; z-index:1001; display:none; padding:10px calc(10px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-bottom,0px));}
#drawBar .panel,#zoneBar .panel{box-shadow:0 -4px 20px rgba(31,42,68,.12);}
.hidden{display:none !important;}
.leaflet-tooltip.zone-label{font-family:'Nunito',sans-serif; font-weight:800; font-size:.62rem; padding:2px 7px; border-radius:999px;
  background:#fff; color:var(--ink); border:1px solid var(--line); box-shadow:0 2px 6px rgba(31,42,68,.1);}
#zoneCountVal{text-align:center; font-weight:800; margin:2px 0 8px; color:var(--accent);}
#seedStatus{font-size:.72rem; color:var(--muted); margin-top:6px; min-height:1em;}
</style>
</head>
<body>

<div id="start">
  <div class="title-wrap">
    <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span>
    <h1>Versteckspiel</h1>
  </div>

  <div id="panelChoice">
    <div class="choice-btn" onclick="showForm('create')">
      <span class="ico">🧑</span><span class="label">Spiel erstellen</span><span class="chev">›</span>
    </div>
    <div class="choice-btn primary" onclick="showForm('join')">
      <span class="ico">↪︎</span><span class="label">Spiel beitreten</span><span class="chev">›</span>
    </div>
  </div>

  <div class="panel hidden" id="panelCreate">
    <button class="link" onclick="showForm('choice')">‹ Zurück</button>
    <label>Dein Name</label>
    <input type="text" id="inNameC" placeholder="Dein Name">
    <label>Rolle</label>
    <div class="row">
      <button class="pill" id="btnRoleSucherC">Sucher</button>
      <button class="pill" id="btnRoleVersteckC">Versteckt</button>
    </div>
    <label>Sperr-Cooldown</label>
    <select id="selCooldown">
      <option value="2">2 Min</option><option value="5">5 Min</option>
      <option value="10" selected>10 Min</option><option value="15">15 Min</option><option value="20">20 Min</option>
    </select>
    <label>Standort-Sichtbarkeit (gegn. Team)</label>
    <select id="selReveal">
      <option value="2">2 Min</option><option value="5">5 Min</option>
      <option value="10" selected>10 Min</option><option value="15">15 Min</option><option value="20">20 Min</option>
    </select>
    <button class="primary" style="margin-top:14px" onclick="createGame()">Spiel erstellen</button>
  </div>

  <div class="panel hidden" id="panelJoin">
    <button class="link" onclick="showForm('choice')">‹ Zurück</button>
    <label>Dein Name</label>
    <input type="text" id="inNameJ" placeholder="Dein Name">
    <label>Rolle</label>
    <div class="row">
      <button class="pill" id="btnRoleSucherJ">Sucher</button>
      <button class="pill" id="btnRoleVersteckJ">Versteckt</button>
    </div>
    <label>Spielcode</label>
    <input type="text" id="inCodeJ" placeholder="Code vom Ersteller">
    <button class="primary" style="margin-top:14px" onclick="joinGame()">Beitreten</button>
  </div>
</div>

<div id="map"></div>
<div id="hud">
  <div class="bar">
    <span id="codeLineShort"></span>
    <span id="revealLine"></span>
    <button id="moreBtn" onclick="toggleMore()">⋮</button>
  </div>
  <div id="morePanel" class="hidden">
    <div class="row" style="align-items:center;gap:6px;">
      <div id="codeLine" style="flex:2;"></div>
      <button class="ghost" style="flex:1;" onclick="copyCode()">Kopieren</button>
    </div>
    <div id="gpsLine" style="color:var(--muted); margin-top:6px;">GPS: —</div>
    <div id="peerLine" style="color:var(--muted); margin-top:2px;"></div>
    <div id="syncLine" style="color:var(--muted); margin-top:4px; font-size:.68rem; border-top:1px solid var(--line); padding-top:4px;"></div>
  </div>
</div>
<div id="banners"></div>

<div id="drawBar">
  <div class="panel">
    <p id="drawHint" style="margin:0 0 10px;font-size:.86rem;color:var(--muted);"></p>
    <div class="row">
      <button class="ghost" onclick="undoPoint()">Zurück</button>
      <button class="primary" onclick="finishShape()">Fertig</button>
    </div>
  </div>
</div>
<div id="zoneBar">
  <div class="panel">
    <p style="margin:0 0 10px;font-size:.86rem;color:var(--muted)">Gebiet erfasst. Zonen festlegen:</p>
    <label>Anzahl Zonen</label>
    <input type="range" id="zoneCount" min="2" max="20" value="6" oninput="document.getElementById('zoneCountVal').textContent=this.value">
    <div id="zoneCountVal">6</div>
    <button class="primary" onclick="doSuggestZones()">An Straßen orientiert vorschlagen</button>
    <p id="seedStatus"></p>
    <div class="row" style="margin-top:8px;">
      <button class="ghost" onclick="startSplitZone()">Zone teilen</button>
      <button class="ghost" onclick="doMergeZones()">Zusammenlegen</button>
    </div>
    <p id="zoneCoverageInfo" style="font-size:.72rem;color:var(--muted);margin:8px 0 0;"></p>
    <div class="row" style="margin-top:8px;">
      <button class="ghost" onclick="resetZones()">Zurücksetzen</button>
      <button class="primary" onclick="pushInitialState()">Spiel starten</button>
    </div>
  </div>
</div>

<div id="bottomSheet">
  <div id="sheetHandle" onclick="toggleSheet()">
    <div class="bar"></div>
    <span id="sheetTitle">Zonen anzeigen</span>
  </div>
  <div id="sheetBody">
    <p id="waitArea" class="hidden" style="margin:0 0 8px;color:var(--muted);font-size:.85rem;">Warte auf Gebietsdaten vom Ersteller…</p>
    <div id="teamTimer">
      <span id="teamTimerLabel">Team-Sperrzeit</span>
      <span id="teamTimerValue">bereit</span>
    </div>
    <div class="row" style="margin-bottom:10px;">
      <button class="ghost hidden" id="btnRedraw" onclick="startDrawBoundary()">Gebiet neu zeichnen</button>
      <button class="ghost" onclick="manualRefresh()">Aktualisieren</button>
    </div>
    <div id="zoneList"></div>
  </div>
</div>

<script>
const NTFY='https://ntfy.sh';
const OVERPASS='https://overpass-api.de/api/interpreter';
const R=111320;
let state={name:'',role:null,code:null,isCreator:false,map:null,myLayer:null,peerLayers:{},boundaryLayer:null,zoneLayers:{},
  mode:null,points:[],previewLayer:null,boundary:null,zones:[],myLocks:[],
  lat:null,lng:null,acc:null,peers:{}, since:'10m',seen:new Set(), revealBucket:null,revealedOpponents:{},
  lockCooldownMin:10, revealIntervalMin:10, lastErr:'', lastSendOk:null, lastPollAt:null, lastPollCount:0, lastPushAt:0};

function showForm(which){
  document.getElementById('panelChoice').classList.toggle('hidden', which!=='choice');
  document.getElementById('panelCreate').classList.toggle('hidden', which!=='create');
  document.getElementById('panelJoin').classList.toggle('hidden', which!=='join');
}
function wireRoleButtons(prefix){
  document.getElementById('btnRoleSucher'+prefix).onclick=()=>setRole('sucher',prefix);
  document.getElementById('btnRoleVersteck'+prefix).onclick=()=>setRole('versteck',prefix);
}
wireRoleButtons('C'); wireRoleButtons('J');
function setRole(r,prefix){
  state.role=r;
  const s=document.getElementById('btnRoleSucher'+prefix), v=document.getElementById('btnRoleVersteck'+prefix);
  s.classList.toggle('on-sucher', r==='sucher'); v.classList.toggle('on-versteck', r==='versteck');
}
function toggleMore(){ document.getElementById('morePanel').classList.toggle('hidden'); }
function toggleSheet(){
  const sheet=document.getElementById('bottomSheet'); const open=sheet.classList.toggle('open');
  document.getElementById('sheetTitle').textContent = open? 'Zonen ausblenden' : 'Zonen anzeigen';
}
function copyCode(){
  const btn=event&&event.target;
  const done=()=>{ if(btn){ const old=btn.textContent; btn.textContent='Kopiert'; setTimeout(()=>btn.textContent=old,1500); } };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(state.code).then(done).catch(()=>fallbackCopy(state.code,done)); }
  else { fallbackCopy(state.code,done); }
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done&&done(); }catch(e){ alert('Code: '+text); }
  document.body.removeChild(ta);
}
function randomCode(){ return 'gv-'+Math.random().toString(36).slice(2,10); }
async function fetchT(url, opts, ms){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(), ms||8000);
  try{ return await fetch(url, Object.assign({}, opts, {signal:ctrl.signal})); }
  finally{ clearTimeout(t); }
}

// ---- Geometrie: Raster, Straßenschnitte, echte Blöcke ----
function pointInPoly(lat,lng,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const yi=poly[i][0], xi=poly[i][1], yj=poly[j][0], xj=poly[j][1];
    const intersect=((yi>lat)!==(yj>lat)) && (lng < (xj-xi)*(lat-yi)/(yj-yi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}
function bboxOf(poly){
  let minLat=Infinity,maxLat=-Infinity,minLng=Infinity,maxLng=-Infinity;
  poly.forEach(p=>{ minLat=Math.min(minLat,p[0]); maxLat=Math.max(maxLat,p[0]); minLng=Math.min(minLng,p[1]); maxLng=Math.max(maxLng,p[1]); });
  return {minLat,maxLat,minLng,maxLng};
}
// ---- Echte Vieleck-Geometrie (kein Raster) ----
function polygonAreaM2(poly){
  if(poly.length<3) return 0;
  const midLat=poly.reduce((s,p)=>s+p[0],0)/poly.length;
  const mPerLng=R*Math.cos(midLat*Math.PI/180);
  let area=0;
  for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length];
    const ax=a[1]*mPerLng, ay=a[0]*R, bx=b[1]*mPerLng, by=b[0]*R;
    area += ax*by-bx*ay;
  }
  return Math.abs(area)/2;
}
function centroidOf(poly){ let sLat=0,sLng=0; poly.forEach(p=>{sLat+=p[0];sLng+=p[1];}); return [sLat/poly.length, sLng/poly.length]; }
function bboxDiagonalM(poly){
  const bb=bboxOf(poly), midLat=(bb.minLat+bb.maxLat)/2;
  const dLat=(bb.maxLat-bb.minLat)*R, dLng=(bb.maxLng-bb.minLng)*R*Math.cos(midLat*Math.PI/180);
  return Math.sqrt(dLat*dLat+dLng*dLng);
}
function extendSegment(p1,p2,marginM){
  const midLat=(p1[0]+p2[0])/2, mPerLng=R*Math.cos(midLat*Math.PI/180);
  const dx=(p2[1]-p1[1])*mPerLng, dy=(p2[0]-p1[0])*R;
  const len=Math.sqrt(dx*dx+dy*dy)||1e-9, ux=dx/len, uy=dy/len;
  const exLngPer=marginM*ux/mPerLng, exLatPer=marginM*uy/R;
  return [[p1[0]-exLatPer,p1[1]-exLngPer],[p2[0]+exLatPer,p2[1]+exLngPer]];
}
function sideSign(p,a,b){ return (b[0]-a[0])*(p[1]-a[1]) - (b[1]-a[1])*(p[0]-a[0]); }
function lineIntersectInf(p1,p2,a,b){
  const x1=p1[0],y1=p1[1],x2=p2[0],y2=p2[1],x3=a[0],y3=a[1],x4=b[0],y4=b[1];
  const denom=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
  if(Math.abs(denom)<1e-15) return null;
  const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/denom;
  return [x1+t*(x2-x1), y1+t*(y2-y1)];
}
function clipBySide(poly,a,b,keepPositive){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const cur=poly[i], prev=poly[(i-1+poly.length)%poly.length];
    const sCur=sideSign(cur,a,b), sPrev=sideSign(prev,a,b);
    const curIn=keepPositive? sCur>=-1e-9 : sCur<=1e-9;
    const prevIn=keepPositive? sPrev>=-1e-9 : sPrev<=1e-9;
    if(curIn){ if(!prevIn){ const ip=lineIntersectInf(prev,cur,a,b); if(ip) out.push(ip); } out.push(cur); }
    else if(prevIn){ const ip=lineIntersectInf(prev,cur,a,b); if(ip) out.push(ip); }
  }
  return out;
}
function sliceByLine(poly,a,b){
  const left=clipBySide(poly,a,b,true), right=clipBySide(poly,a,b,false);
  if(left.length<3||right.length<3) return [null,null];
  return [left,right];
}
function closeEnough(p,q,eps){ return Math.abs(p[0]-q[0])<eps && Math.abs(p[1]-q[1])<eps; }
function findSharedEdge(A,B,eps){
  for(let i=0;i<A.length;i++){
    const a1=A[i], a2=A[(i+1)%A.length];
    for(let j=0;j<B.length;j++){
      const b1=B[j], b2=B[(j+1)%B.length];
      if(closeEnough(a1,b2,eps) && closeEnough(a2,b1,eps)) return {i,j};
    }
  }
  return null;
}
function mergePolygons(A,B,eps){
  eps=eps||1e-7;
  const hit=findSharedEdge(A,B,eps); if(!hit) return null;
  const {i,j}=hit; const nA=A.length, nB=B.length;
  const out=[A[i]];
  for(let k=1;k<nB;k++) out.push(B[(j+1+k)%nB]);
  for(let k=2;k<nA;k++) out.push(A[(i+k)%nA]);
  return out;
}
function segmentsFromLines(lines){ const segs=[]; lines.forEach(line=>{ for(let i=0;i<line.length-1;i++) segs.push([line[i],line[i+1]]); }); return segs; }
async function fetchStreetData(boundary){
  const bb=bboxOf(boundary);
  const query=`[out:json][timeout:15];way["highway"](${bb.minLat},${bb.minLng},${bb.maxLat},${bb.maxLng});out geom;`;
  const res=await fetchT(OVERPASS+'?data='+encodeURIComponent(query), {}, 15000);
  if(!res.ok) throw new Error('Status '+res.status);
  const data=await res.json();
  const lines=[];
  (data.elements||[]).forEach(w=>{ const line=(w.geometry||[]).map(g=>[g.lat,g.lon]); if(line.length>1) lines.push(line); });
  return lines;
}
// Zerschneidet das Gebiet Straße für Straße (jede Linie wird großzügig verlängert, damit sie das jeweils
// getroffene Stück komplett durchtrennt) bis genau n Teile entstehen. Reichen die Straßen nicht aus,
// wird das größte verbleibende Stück einfach gerade halbiert.
function buildPartition(boundary, streetLines, n){
  let pieces=[boundary.slice()];
  const diag=bboxDiagonalM(boundary);
  const segs=segmentsFromLines(streetLines).map(([p1,p2])=>extendSegment(p1,p2,diag*2));
  const minArea=polygonAreaM2(boundary)*0.01;
  for(const [a,b] of segs){
    if(pieces.length>=n) break;
    let bestIdx=-1,bestA=null,bestB=null,bestBalance=-1;
    pieces.forEach((piece,idx)=>{
      const [pa,pb]=sliceByLine(piece,a,b);
      if(pa&&pb){ const areaA=polygonAreaM2(pa),areaB=polygonAreaM2(pb); const balance=Math.min(areaA,areaB);
        if(balance>bestBalance){ bestBalance=balance; bestIdx=idx; bestA=pa; bestB=pb; } }
    });
    if(bestIdx>=0 && bestBalance>minArea) pieces.splice(bestIdx,1,bestA,bestB);
  }
  let guard=0;
  while(pieces.length<n && guard<50){
    guard++;
    let idx=0,best=-1;
    pieces.forEach((p,i)=>{ const ar=polygonAreaM2(p); if(ar>best){best=ar;idx=i;} });
    const piece=pieces[idx]; const bb=bboxOf(piece), c=centroidOf(piece);
    const wide=(bb.maxLng-bb.minLng)*R*Math.cos(c[0]*Math.PI/180) > (bb.maxLat-bb.minLat)*R;
    const [a,b]= wide? [[bb.minLat-0.01,c[1]],[bb.maxLat+0.01,c[1]]] : [[c[0],bb.minLng-0.01],[c[0],bb.maxLng+0.01]];
    const [pa,pb]=sliceByLine(piece,a,b);
    if(pa&&pb && polygonAreaM2(pa)>minArea*0.3 && polygonAreaM2(pb)>minArea*0.3) pieces.splice(idx,1,pa,pb);
    else break;
  }
  return pieces;
}
function pointInZone(lat,lng,zone){ return pointInPoly(lat,lng,zone.ring); }
function zoneLeafletCoords(zone){ return zone.ring; }
function updateZoneCoverageInfo(){ document.getElementById('zoneCoverageInfo').textContent=''; }
function findZoneByName(n){ return state.zones.find(z=>z.name.toLowerCase()===String(n||'').trim().toLowerCase()); }

// ---- ntfy Sync ----
async function ntfyPublish(obj){
  try{
    const res=await fetchT(`${NTFY}/${state.code}`, {method:'POST', body:JSON.stringify(obj)});
    state.lastSendOk=res.ok; if(!res.ok) state.lastErr='Senden: Status '+res.status;
    updateSyncLine(); return res.ok;
  }catch(e){ state.lastSendOk=false; state.lastErr='Senden FEHLER: '+e.message; updateSyncLine(); return false; }
}
async function ntfyPoll(){
  try{
    const res=await fetchT(`${NTFY}/${state.code}/json?poll=1&since=${state.since}`);
    state.lastPollAt=Date.now();
    if(!res.ok){ state.lastErr='Abrufen: Status '+res.status; state.lastPollCount=0; updateSyncLine(); return []; }
    const text=await res.text(); const out=[];
    text.split('\n').forEach(line=>{
      if(!line.trim()) return;
      try{
        const env=JSON.parse(line);
        if(env.event==='message' && env.message && !state.seen.has(env.id)){
          state.seen.add(env.id); state.since=env.time;
          try{ out.push(JSON.parse(env.message)); }catch(e){}
        }
      }catch(e){}
    });
    state.lastPollCount=out.length; state.lastErr=''; updateSyncLine();
    return out;
  }catch(e){ state.lastErr='Abrufen FEHLER: '+e.message; updateSyncLine(); return []; }
}
function r6(x){ return Math.round(x*1e6)/1e6; }
function zonesToWire(){ return state.zones.map(z=>({id:z.id,name:z.name,ring:z.ring.map(p=>[r6(p[0]),r6(p[1])])})); }
function zonesFromWire(arr){ return (arr||[]).map(z=>({id:z.id,name:z.name,ring:z.ring||[]})); }
function applyMsg(m){
  if(m.type==='geometry'){
    state.boundary=m.boundary; state.zones=zonesFromWire(m.zones);
    if(m.lockCooldownMin) state.lockCooldownMin=m.lockCooldownMin;
    if(m.revealIntervalMin) state.revealIntervalMin=m.revealIntervalMin;
    if(state.map){ redrawZones(); const w=document.getElementById('waitArea'); if(w) w.classList.add('hidden'); }
  } else if(m.type==='player' && m.name!==state.name){
    state.peers[m.name]={role:m.role, lat:m.lat, lng:m.lng, acc:m.acc, myLocks:m.myLocks||[]};
  }
}
function updateSyncLine(){
  const el=document.getElementById('syncLine'); if(!el) return;
  const t=state.lastPollAt? new Date(state.lastPollAt).toLocaleTimeString() : '–';
  el.textContent=`Senden: ${state.lastSendOk===null?'–':(state.lastSendOk?'OK':'Fehler')} · Abruf: ${t} (${state.lastPollCount} neu) · Mitspieler: ${Object.keys(state.peers).length}`+(state.lastErr?` · Fehler: ${state.lastErr}`:'');
}
async function createGame(){
  state.name=document.getElementById('inNameC').value.trim()||'Spieler';
  if(!state.role){ alert('Bitte Rolle auswählen.'); return; }
  state.lockCooldownMin=Number(document.getElementById('selCooldown').value);
  state.revealIntervalMin=Number(document.getElementById('selReveal').value);
  state.code=randomCode(); state.isCreator=true;
  const ok=await ntfyPublish({type:'ping'});
  if(!ok){ alert('Verbindung fehlgeschlagen.\nDetail: '+(state.lastErr||'unbekannt')); return; }
  enterMap();
}
async function joinGame(){
  state.name=document.getElementById('inNameJ').value.trim()||'Spieler';
  if(!state.role){ alert('Bitte Rolle auswählen.'); return; }
  const c=document.getElementById('inCodeJ').value.trim();
  if(!c){ alert('Bitte Spielcode eingeben.'); return; }
  state.code=c; state.since='24h'; state.isCreator=false;
  const msgs=await ntfyPoll(); msgs.forEach(applyMsg);
  enterMap();
}

function enterMap(){
  document.getElementById('start').style.display='none';
  document.getElementById('map').style.display='block';
  document.getElementById('hud').style.display='block';
  document.getElementById('bottomSheet').style.display='block';
  document.getElementById('btnRedraw').classList.toggle('hidden', !state.isCreator);
  document.getElementById('codeLine').textContent='Code: '+state.code;
  document.getElementById('codeLineShort').textContent=state.code;
  updateSyncLine();
  state.map=L.map('map').setView([51.8309,7.2783], 16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap-Mitwirkende', maxZoom:19}).addTo(state.map);
  startGeolocation();
  redrawZones();
  if(!state.boundary){ if(state.isCreator){ startDrawBoundary(); } else { document.getElementById('waitArea').classList.remove('hidden'); } }
  pollLoop();
  setInterval(tick, 2000);
}

// ---- Zeichnen ----
function startDrawBoundary(){
  state.mode='boundary'; state.points=[]; state.zones=[]; state.boundary=null;
  document.getElementById('drawBar').style.display='block';
  document.getElementById('zoneBar').style.display='none';
  document.getElementById('drawHint').textContent='Eckpunkte entlang der Gebietsgrenze antippen, dann "Fertig".';
  state.map.off('click'); state.map.on('click', onMapClickDraw);
  redrawZones();
}
function startSplitZone(){
  if(!state.zones.length){ alert('Noch keine Zonen vorhanden.'); return; }
  let target=state.zones[0];
  if(state.zones.length>1){
    const name=prompt('Welche Zone teilen? ('+state.zones.map(z=>z.name).join(', ')+')', state.zones[0].name);
    const found=findZoneByName(name);
    if(!found){ alert('Zone nicht gefunden.'); return; }
    target=found;
  }
  state.mode='zone-split'; state.splitTarget=target.id; state.points=[];
  document.getElementById('drawBar').style.display='block';
  document.getElementById('zoneBar').style.display='none';
  document.getElementById('drawHint').textContent='Tippe Start- und Endpunkt der Trennlinie durch "'+target.name+'", dann "Fertig".';
  state.map.off('click'); state.map.on('click', onMapClickDraw);
}
function onMapClickDraw(e){ state.points.push([e.latlng.lat,e.latlng.lng]); drawPreview(); }
function undoPoint(){ state.points.pop(); drawPreview(); }
function drawPreview(){
  if(state.previewLayer) state.map.removeLayer(state.previewLayer);
  if(state.points.length) state.previewLayer=L.polygon(state.points, {color: state.mode==='zone-split'?'#e5484d':'#5b8def'}).addTo(state.map);
}
function finishShape(){
  if(state.mode==='boundary'){
    if(state.points.length<3){ alert('Mindestens 3 Punkte nötig.'); return; }
    if(state.previewLayer){ state.map.removeLayer(state.previewLayer); state.previewLayer=null; }
    state.boundary=state.points.slice(); state.points=[];
    state.map.off('click'); state.mode=null;
    document.getElementById('drawBar').style.display='none';
    document.getElementById('zoneBar').style.display='block';
    redrawZones(); updateZoneCoverageInfo();
  } else if(state.mode==='zone-split'){
    if(state.points.length<2){ alert('Bitte Start- und Endpunkt antippen.'); return; }
    if(state.previewLayer){ state.map.removeLayer(state.previewLayer); state.previewLayer=null; }
    const target=state.zones.find(z=>z.id===state.splitTarget);
    const a=state.points[0], b=state.points[state.points.length-1];
    state.points=[];
    const diag=bboxDiagonalM(target.ring);
    const [ea,eb]=extendSegment(a,b,diag*2);
    const [ra,rb]=sliceByLine(target.ring, ea, eb);
    if(!ra||!rb){ alert('Diese Linie teilt die Zone nicht in zwei sinnvolle Teile.'); }
    else{
      const idx=state.zones.findIndex(z=>z.id===target.id);
      state.zones.splice(idx,1,{id:'z'+Date.now()+'a', name:target.name+'.1', ring:ra},{id:'z'+Date.now()+'b', name:target.name+'.2', ring:rb});
    }
    state.map.off('click'); state.mode=null;
    document.getElementById('drawBar').style.display='none';
    document.getElementById('zoneBar').style.display='block';
    redrawZones(); updateZoneCoverageInfo();
  }
}
async function doSuggestZones(){
  const n=Number(document.getElementById('zoneCount').value);
  const statusEl=document.getElementById('seedStatus');
  statusEl.textContent='Lade Straßendaten…';
  let lines=[];
  try{ lines=await fetchStreetData(state.boundary); statusEl.textContent=`${lines.length} Straßen geladen, Gebiet entlang ihnen in ${n} Zonen zerschnitten.`; }
  catch(e){ statusEl.textContent='⚠ Straßendaten nicht verfügbar – Gebiet wird gleichmäßig geteilt ('+e.message+').'; }
  const pieces=buildPartition(state.boundary, lines, n);
  state.zones=pieces.map((ring,i)=>({id:'z'+Date.now()+'_'+i, name:'Zone '+(i+1), ring}));
  redrawZones(); updateZoneCoverageInfo();
}
function doMergeZones(){
  if(state.zones.length<2){ alert('Mindestens zwei Zonen nötig.'); return; }
  const names=state.zones.map(z=>z.name).join(', ');
  const n1=prompt('Erste Zone zum Zusammenlegen? ('+names+')'); const z1=findZoneByName(n1);
  if(!z1){ alert('Zone nicht gefunden.'); return; }
  const n2=prompt('Mit welcher Zone zusammenlegen?'); const z2=findZoneByName(n2);
  if(!z2||z2.id===z1.id){ alert('Zone nicht gefunden oder identisch mit der ersten.'); return; }
  const merged=mergePolygons(z1.ring, z2.ring, 1e-6);
  if(!merged){ alert('Diese beiden Zonen grenzen nicht direkt mit einer geraden Kante aneinander.'); return; }
  state.zones=state.zones.filter(z=>z.id!==z1.id && z.id!==z2.id);
  state.zones.push({id:'z'+Date.now(), name:z1.name, ring:merged});
  redrawZones(); updateZoneCoverageInfo();
}
function resetZones(){ state.zones=[]; document.getElementById('seedStatus').textContent=''; redrawZones(); updateZoneCoverageInfo(); }
async function pushInitialState(){
  if(!state.zones.length){ if(!confirm('Noch keine Zonen festgelegt. Trotzdem starten?')) return; }
  await ntfyPublish({type:'geometry', boundary:state.boundary, zones:zonesToWire(), lockCooldownMin:state.lockCooldownMin, revealIntervalMin:state.revealIntervalMin});
  document.getElementById('zoneBar').style.display='none';
}
function redrawZones(){
  if(state.boundaryLayer) state.map.removeLayer(state.boundaryLayer);
  if(state.boundary) state.boundaryLayer=L.polygon(state.boundary,{color:'#5b8def',fillOpacity:.02,weight:2}).addTo(state.map);
  Object.values(state.zoneLayers).forEach(l=>state.map.removeLayer(l)); state.zoneLayers={};
  (state.zones||[]).forEach(z=>{
    state.zoneLayers[z.id]=L.polygon(zoneLeafletCoords(z),{color:'#2fae66',weight:1.5,fillOpacity:.2})
      .bindTooltip(z.name, {permanent:true, direction:'center', className:'zone-label'})
      .addTo(state.map);
  });
  renderZoneList(); updateZoneVisuals();
}

// ---- GPS ----
function startGeolocation(){
  if(!navigator.geolocation){ document.getElementById('gpsLine').textContent='GPS: nicht unterstützt.'; return; }
  navigator.geolocation.watchPosition(pos=>{
    state.lat=pos.coords.latitude; state.lng=pos.coords.longitude; state.acc=pos.coords.accuracy;
    document.getElementById('gpsLine').textContent=`GPS: ${state.lat.toFixed(5)}, ${state.lng.toFixed(5)} ±${Math.round(state.acc)}m`;
    if(!state.myLayer){ state.myLayer=L.circleMarker([state.lat,state.lng],{radius:8,color:'#fff',weight:2,fillColor:state.role==='sucher'?'#ff9346':'#2bb8a6',fillOpacity:1}).bindPopup(state.name+' (du)').addTo(state.map); state.map.setView([state.lat,state.lng],17); }
    else { state.myLayer.setLatLng([state.lat,state.lng]); }
    checkStatus(); pushMyState(true);
  }, err=>{ document.getElementById('gpsLine').textContent='GPS: Fehler – '+err.message; }, {enableHighAccuracy:true, maximumAge:4000});
}

function combinedLocks(){
  const set=new Set();
  const all=Object.assign({}, state.peers, {__self:{role:state.role, myLocks:state.myLocks}});
  Object.values(all).forEach(p=>{ if(p.role==='sucher' && p.myLocks) p.myLocks.forEach(l=>set.add(l.zoneId)); });
  return set;
}
function lastAnyLockAt(){
  let max=0;
  const all=Object.assign({}, state.peers, {__self:{role:state.role, myLocks:state.myLocks}});
  Object.values(all).forEach(p=>{ if(p.role==='sucher' && p.myLocks) p.myLocks.forEach(l=>{ if(l.lockedAt>max) max=l.lockedAt; }); });
  return max;
}
async function lockZone(id){
  if(combinedLocks().has(id)){ alert('Diese Zone ist bereits gesperrt.'); tick(); return; }
  const cooldownMs=state.lockCooldownMin*60000;
  const remaining=cooldownMs-(Date.now()-lastAnyLockAt());
  if(remaining>0){ alert('Noch '+formatMMSS(remaining)+' bis zur nächsten Sperre (Team-Timer).'); return; }
  state.myLocks.push({zoneId:id, lockedAt:Date.now()});
  await pushMyState(true); tick();
}
function formatMMSS(ms){ const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000); return m+':'+String(s).padStart(2,'0'); }
function updateZoneVisuals(){
  const locks=combinedLocks();
  (state.zones||[]).forEach(z=>{
    const l=state.zoneLayers[z.id]; if(!l) return;
    const locked=locks.has(z.id);
    l.setStyle({color: locked?'#e5484d':'#2fae66', fillOpacity: locked?.3:.18});
  });
}
function checkStatus(){
  if(state.lat==null||!state.boundary) return;
  const locks=combinedLocks();
  const banners=document.getElementById('banners'); banners.innerHTML='';
  const inBoundary=pointInPoly(state.lat,state.lng,state.boundary);
  if(!inBoundary){ banners.innerHTML='<div class="banner danger">⚠️ Außerhalb des Spielgebiets</div>'; }
  else{
    const inLocked=(state.zones||[]).some(z=>locks.has(z.id)&&pointInZone(state.lat,state.lng,z));
    banners.innerHTML = inLocked ? '<div class="banner danger">🔒 Gesperrte Zone!</div>' : '<div class="banner safe">✓ Erlaubter Bereich</div>';
  }
}
function renderZoneList(){
  const locks=combinedLocks();
  const zl=document.getElementById('zoneList'); zl.innerHTML='';
  (state.zones||[]).forEach(z=>{
    const locked=locks.has(z.id);
    const row=document.createElement('div'); row.className='zone-row';
    const remaining=state.lockCooldownMin*60000-(Date.now()-lastAnyLockAt());
    let btn='';
    if(state.role==='sucher' && !locked){ const dis=remaining>0; btn=`<button ${dis?'disabled':''} onclick="lockZone('${z.id}')">${dis?formatMMSS(remaining):'Sperren'}</button>`; }
    row.innerHTML=`<span>${z.name}<span class="tag ${locked?'locked':'open'}">${locked?'gesperrt':'offen'}</span></span>${btn}`; zl.appendChild(row);
  });
  const ttVal=document.getElementById('teamTimerValue');
  const remaining=state.lockCooldownMin*60000-(Date.now()-lastAnyLockAt());
  ttVal.textContent = remaining>0 ? formatMMSS(remaining) : 'bereit';
}

// ---- Sync-Takt & Sichtbarkeit ----
function currentBucket(){ return Math.floor(Date.now()/(state.revealIntervalMin*60000)); }
function oppositeRole(){ return state.role==='sucher' ? 'versteck' : 'sucher'; }
function maybeReveal(){
  const b=currentBucket();
  if(state.revealBucket===b) return;
  state.revealBucket=b; state.revealedOpponents={};
  const opp=oppositeRole();
  Object.entries(state.peers).forEach(([n,p])=>{ if(p.role===opp && p.lat!=null) state.revealedOpponents[n]={lat:p.lat,lng:p.lng}; });
}
function renderPeers(){
  const opp=oppositeRole();
  Object.entries(state.peers).forEach(([name,p])=>{
    let pos=p;
    if(p.role===opp){
      pos=state.revealedOpponents[name];
      if(!pos){ if(state.peerLayers[name]){ state.map.removeLayer(state.peerLayers[name]); delete state.peerLayers[name]; } return; }
    }
    if(pos.lat==null) return;
    if(!state.peerLayers[name]) state.peerLayers[name]=L.circleMarker([pos.lat,pos.lng],{radius:6,color:'#fff',weight:2,fillColor:p.role==='sucher'?'#ff9346':'#2bb8a6',fillOpacity:1}).bindPopup(name).addTo(state.map);
    else state.peerLayers[name].setLatLng([pos.lat,pos.lng]);
  });
}
function updateRevealLine(){
  const el=document.getElementById('revealLine'); if(!el) return;
  const remaining=Math.max(0,(currentBucket()+1)*state.revealIntervalMin*60000-Date.now());
  el.textContent='⏱ '+formatMMSS(remaining);
}
function updatePeerLine(){
  document.getElementById('peerLine').textContent='Mitspieler: '+(Object.keys(state.peers).length? Object.entries(state.peers).map(([n,p])=>`${n} (${p.role==='sucher'?'Sucher':'Versteckt'})`).join(', ') : 'nur du bisher');
}
function tick(){
  pushMyState(false);
  maybeReveal(); renderPeers(); updateZoneVisuals(); checkStatus(); renderZoneList(); updateRevealLine(); updateSyncLine();
}
async function manualRefresh(){
  const msgs=await ntfyPoll(); msgs.forEach(applyMsg); updatePeerLine(); tick();
}
async function pushMyState(force){
  if(!state.code||state.lat==null) return;
  if(!force && Date.now()-(state.lastPushAt||0)<8000) return;
  state.lastPushAt=Date.now();
  await ntfyPublish({type:'player', name:state.name, role:state.role, lat:state.lat, lng:state.lng, acc:state.acc, myLocks:state.myLocks});
}
async function pollLoop(){
  const msgs=await ntfyPoll();
  if(msgs.length){ msgs.forEach(applyMsg); }
  updatePeerLine(); tick();
  setTimeout(pollLoop, 6000);
}
</script>
